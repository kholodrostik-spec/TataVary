<!doctype html>
<html lang="cs" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#FCEE00">
    <meta name="description"
        content="Táta vaří (Tata Vary) — domácí kuchyně, poctivé suroviny a chuť domova. Menu a kontakty připravujeme.">
    <title>Táta vaří — Jako doma | Tata Vary</title>
    <link rel="icon" href="assets/favicon.png">
    <script>try { const t = JSON.parse(localStorage.getItem("tv-theme")); document.documentElement.dataset.theme = t === "light" ? "light" : "dark" } catch { document.documentElement.dataset.theme = "dark" }</script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a href="#menu" class="skip" data-i="skip"></a>
    <header id="header"><a class="brand" href="#home" aria-label="Táta vaří"><img src="assets/logo.webp" alt="Táta vaří"
                width="87" height="65"></a>
        <nav id="nav"><a href="#menu" data-i="menu"></a><a href="#about" data-i="about"></a><a href="#contact" data-i="contact"></a></nav>
        <div class="nav-actions">
            <div class="languages" aria-label="Language"><button data-lang="cs" lang="cs"
                    aria-label="Čeština">CS</button><span>/</span><button data-lang="en" lang="en"
                    aria-label="English">EN</button><span>/</span><button data-lang="pl" lang="pl"
                    aria-label="Polski">PL</button></div><button id="themeToggle" class="theme-toggle" type="button"
                aria-label="Switch to light theme" aria-pressed="false"><span id="themeIcon"
                    aria-hidden="true">☀</span></button><a class="button small" href="#contact"
                data-i="visit"></a><button id="burger" aria-label="Menu" aria-expanded="false">☰</button>
        </div>
    </header>
    <main>
        <section class="hero" id="home">
            <div class="hero-copy">
                <p class="eyebrow" data-i="eyebrow"></p>
                <h1><span data-i="hero1"></span><br><span class="yellow" data-i="hero2"></span></h1>
                <p class="intro" data-i="intro"></p>
                <div class="buttons"><a class="button" href="#menu"><span data-i="seeMenu"></span></a><a
                        class="button outline" href="#contact" data-i="directions"></a></div>
                <div class="hero-note"><span class="dot"></span><span data-i="hoursPending"></span></div>
            </div>
            <div class="hero-art">
                <div class="orbit"></div><img src="assets/logo.webp"
                    alt="Táta vaří" data-alt="logoAlt" width="900" height="674">
            </div><a class="scroll" href="#specials"><span data-i="scroll"></span> ↓</a><span class="hero-index">01 /
                TÁTA VAŘÍ</span>
        </section>
        <section class="section cream" id="specials">
            <div class="section-top">
                <div>
                    <p class="eyebrow dark" data-i="specialLabel"></p>
                    <h2 data-i="specialTitle"></h2>
                </div>
                <p class="aside" data-i="specialAside"></p>
            </div>
            <div class="panels"><a class="panel" href="#menu"><span class="number">01</span>
                    <div>
                        <p data-i="coming"></p>
                        <h3 data-i="daily"></h3><span class="panel-arrow">↗</span>
                    </div>
                </a><a class="panel" href="#menu"><span class="number">02</span>
                    <div>
                        <p data-i="coming"></p>
                        <h3 data-i="dadTip"></h3><span class="panel-arrow">↗</span>
                    </div>
                </a><a class="panel" href="#menu"><span class="number">03</span>
                    <div>
                        <p data-i="coming"></p>
                        <h3 data-i="seasonal"></h3><span class="panel-arrow">↗</span>
                    </div>
                </a></div>
        </section>
        <section class="section" id="menu">
            <div class="section-top">
                <div>
                    <p class="eyebrow" data-i="menuLabel"></p>
                    <h2 data-i="menuTitle"></h2>
                </div><button class="text-button" data-modal="allergens"><span data-i="allergens"></span></button>
            </div>
            <div class="tabs" id="tabs" role="tablist"></div>
            <div id="menu-content" role="tabpanel"></div>
            <div class="menu-bottom"><span data-i="menuNote"></span>
                <div><button id="prev" class="round" data-aria="previous">←</button><button id="next" class="round"
                        data-aria="next">→</button></div>
            </div>
        </section>
        <section class="section about" id="about">
            <div class="about-art"><img src="assets/logo.webp" alt="Táta vaří" width="680" height="509"
                    loading="lazy"></div>
            <div>
                <p class="eyebrow dark" data-i="aboutLabel"></p>
                <h2 data-i="aboutTitle"></h2>
                <p class="about-intro" data-i="aboutIntro"></p>
                <div class="reason"><span>01</span>
                    <div>
                        <h3 data-i="r1"></h3>
                        <p data-i="r1Text"></p>
                    </div>
                </div>
                <div class="reason"><span>02</span>
                    <div>
                        <h3 data-i="r2"></h3>
                        <p data-i="r2Text"></p>
                    </div>
                </div>
                <div class="reason"><span>03</span>
                    <div>
                        <h3 data-i="r3"></h3>
                        <p data-i="r3Text"></p>
                    </div>
                </div>
            </div>
        </section>
        <section class="section cream" id="contact">
            <div class="section-top">
                <div>
                    <p class="eyebrow dark" data-i="contactLabel"></p>
                    <h2 data-i="contactTitle"></h2>
                </div>
                <p class="aside" data-i="contactIntro"></p>
            </div>
            <div class="contact-grid">
                <div class="contact-card">
                    <h3>TÁTA VAŘÍ</h3>
                    <p id="address"></p>
                    <dl>
                        <dt data-i="phone"></dt>
                        <dd id="phone"></dd>
                        <dt>E-mail</dt>
                        <dd id="email"></dd>
                    </dl>
                    <h4 data-i="hours"></h4>
                    <div id="hours"></div>
                    <div id="contact-actions"></div>
                </div>
                <div class="map" id="map">
                    <div class="map-grid"></div>
                    <div class="map-pin">⌖</div>
                    <h3 data-i="mapPending"></h3>
                    <p data-i="mapNote"></p>
                </div>
            </div>
            <details class="contact-form">
                <summary data-i="writeUs"></summary>
                <form id="contactForm"><label><span data-i="name"></span><input name="name" required
                            autocomplete="name"></label><label>E-mail<input type="email" name="email" required
                            autocomplete="email"></label><label class="full"><span data-i="message"></span><textarea
                            name="message" rows="4" required></textarea></label><input class="honeypot" name="website"
                        tabindex="-1" autocomplete="off"><label class="full consent"><input type="checkbox"
                            required><span data-i="formConsent"></span></label><button class="button" type="submit"
                        data-i="send"></button>
                    <p class="full" id="formStatus" role="status"></p>
                </form>
            </details>
        </section>
        <div class="closing">
            <p data-i="closing"></p><a href="#home" data-aria="backToTop">↑</a>
        </div>
    </main>
    <footer>
        <div class="footer-grid">
            <div><img src="assets/logo.webp" alt="Táta vaří" width="150" height="112" loading="lazy">
                <p data-i="footerLine"></p>
            </div>
            <div>
                <h4 data-i="navigation"></h4>
                <a href="#menu" data-i="menu"></a>
                <a href="#about" data-i="about"></a>
                <a href="#gallery" data-i="gallery"></a>
                <a href="#contact" data-i="contact"></a>
                <a
                    href="https://www.instagram.com/YOUR_ACCAUNT/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Instagram
                </a>
            </div>
            <div>
                <h4 data-i="contact"></h4>
                <p data-i="detailsPending"></p>
                <p id="legalCompany"></p>
            </div>
            <div>
                <h4 data-i="information"></h4><button data-modal="allergens" data-i="allergens"></button><button
                    data-modal="privacy" data-i="privacy"></button><button data-modal="terms"
                    data-i="terms"></button><button data-modal="cookies" data-i="cookies"></button><button
                    id="cookieSettings" data-i="cookieSettings"></button>
            </div>
        </div>
        <div class="footer-bottom"><span>© <span id="year"></span> Táta vaří · Tata Vary</span><span
                data-i="madeWith"></span></div>
    </footer>
    <aside id="cookieBanner" hidden>
        <div><strong data-i="cookieTitle"></strong>
            <p data-i="cookieText"></p>
        </div>
        <div class="cookie-buttons"><button data-cookie="reject" data-i="reject"></button><button data-cookie="settings"
                data-i="settings"></button><button class="button small" data-cookie="accept" data-i="accept"></button>
        </div>
    </aside>
    <dialog id="dialog"><button class="close" id="closeDialog" data-aria="close">×</button>
        <div id="dialogContent"></div>
    </dialog>
    <script src="locales.js"></script>
    <script src="app.js"></script>
</body>

</html>
